<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SHALAND product review, pros, cons and buying verdict."><title>Product Review — SHALAND</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap product-page"><a class="logo" href="index.html">SHA<span>LAND</span></a><div id="detail"></div></main><script src="products.js"></script><script>
const id=new URLSearchParams(location.search).get("id"),p=PRODUCTS.find(x=>x.id==id)||PRODUCTS[0];document.title=p.name+" Review — SHALAND";
document.getElementById("detail").innerHTML=`<div class="eyebrow" style="margin-top:55px">SHALAND REVIEW / ${p.category.toUpperCase()}</div>
<h1 style="font-size:clamp(2.7rem,7vw,5rem);line-height:.95;letter-spacing:-.07em;margin:12px 0 25px">${p.name}</h1>
<div class="product-image" style="height:430px"><img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover"><span class="badge">${p.badge}</span></div>
<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:24px 0"><strong style="font-size:1.5rem">${p.price}</strong><span class="stars">${"★".repeat(Math.round(p.rating))} ${p.rating}/5</span><span class="muted">Best for: ${p.bestFor}</span></div>
<p style="font-size:1.15rem;max-width:800px">${p.description}</p>
<div class="guide-grid" style="margin:35px 0"><article><span class="guide-number">01</span><h3>Pros</h3><p>${p.pros.map(x=>"✓ "+x).join("<br>")}</p></article><article><span class="guide-number">02</span><h3>Consider</h3><p>${p.cons.map(x=>"• "+x).join("<br>")}</p></article><article><span class="guide-number">03</span><h3>Our verdict</h3><p>${p.verdict}</p></article></div>
<a class="btn primary" href="${p.affiliateUrl}" target="_blank" rel="nofollow sponsored noopener">Check current price ↗</a>
<p class="muted" style="margin-top:28px">Affiliate disclosure: SHALAND may earn a commission from qualifying purchases at no extra cost to you. Prices, stock and specifications can change; confirm current details at the retailer.</p>
<a href="index.html#shop" style="display:inline-block;margin-top:10px;color:#6d5dfc;font-weight:900">← Back to picks</a>`;
</script></body></html>
