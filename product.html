<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Product review and buying guide — SHALAND"><title>Product Review — SHALAND</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap" style="padding:55px 0;max-width:1000px"><a class="logo" href="index.html">Smart<span>Picks</span></a><div id="detail" style="margin-top:45px"></div></main><script src="products.js"></script><script>
const id=new URLSearchParams(location.search).get("id"),p=PRODUCTS.find(x=>x.id==id)||PRODUCTS[0];document.title=p.name+" Review — SHALAND";
document.getElementById("detail").innerHTML=`<div class="eyebrow">PRODUCT REVIEW</div><h1 style="font-size:clamp(2.5rem,6vw,4.5rem);line-height:1;margin:10px 0 25px">${p.name}</h1><div class="productImage" style="height:430px"><img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover"><span class="badge">${p.badge}</span></div><div style="display:flex;gap:25px;align-items:center;flex-wrap:wrap;margin:25px 0"><strong style="font-size:1.6rem">${p.price}</strong><span class="stars">${"★".repeat(Math.round(p.rating))} ${p.rating}/5</span><span class="muted">Best for: ${p.bestFor}</span></div><p style="font-size:1.12rem">${p.description}</p><div class="guideGrid" style="padding:25px 0"><article><h3>Pros</h3><p>${p.pros.map(x=>"✓ "+x).join("<br>")}</p></article><article><h3>Consider</h3><p>${p.cons.map(x=>"• "+x).join("<br>")}</p></article><article><h3>Our verdict</h3><p>${p.verdict}</p></article></div><a class="btn primary" href="${p.affiliateUrl}" target="_blank" rel="nofollow sponsored noopener">Check current price ↗</a><p class="muted" style="margin-top:30px">Affiliate links may earn SHALAND a commission at no extra cost to you. Prices, availability and specifications can change; confirm current details at the retailer.</p><a href="index.html#shop" style="display:inline-block;margin-top:10px;color:#635bff;font-weight:850">← Back to products</a>`;
</script></body></html>
